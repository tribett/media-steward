<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background fill for extension icon legibility -->
  <rect width="128" height="128" rx="20" fill="#1a1410"/>

  <!-- Shield body -->
  <path d="M64 10 L106 28 L106 68 C106 92 88 110 64 120 C40 110 22 92 22 68 L22 28 Z"
        fill="#2a1f0e"
        stroke="#d4a853"
        stroke-width="5"
        stroke-linejoin="round"/>

  <!-- Inner shield glow -->
  <path d="M64 10 L106 28 L106 68 C106 92 88 110 64 120 C40 110 22 92 22 68 L22 28 Z"
        fill="url(#glow)"
        opacity="0.3"/>

  <!-- Flame body -->
  <path d="M64 42 C64 42 74 54 74 63 C74 68.5 69.5 73 64 73 C58.5 73 54 68.5 54 63 C54 54 64 42 64 42 Z"
        fill="#d4a853"/>

  <!-- Flame highlight -->
  <path d="M64 50 C64 50 70 59 70 65 C70 68.3 67.3 71 64 71 C64 71 68 67 67 63 C66 59 64 50 64 50 Z"
        fill="#f0c870"
        opacity="0.7"/>

  <!-- Wick stem -->
  <line x1="64" y1="73" x2="64" y2="88"
        stroke="#d4a853"
        stroke-width="4"
        stroke-linecap="round"
        opacity="0.5"/>

  <!-- Gradient def -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d4a853" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d4a853" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
