services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - db-data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  dns:
    build:
      context: .
      dockerfile: apps/dns/Dockerfile
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - db-data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - UPSTREAM_DNS=${UPSTREAM_DNS:-8.8.8.8}
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      web:
        condition: service_healthy

volumes:
  db-data:
